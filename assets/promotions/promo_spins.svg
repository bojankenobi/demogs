<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-grad-spins" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c1f" />
      <stop offset="50%" stop-color="#24133b" />
      <stop offset="100%" stop-color="#080410" />
    </linearGradient>
    <radialGradient id="purple-glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#ffd700" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="text-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="spin-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#a855f7" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-spins)" />
  <circle cx="400" cy="160" r="260" fill="url(#purple-glow)" />

  <rect x="18" y="18" width="764" height="414" rx="14" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-opacity="0.5" />
  <rect x="26" y="26" width="748" height="398" rx="10" fill="none" stroke="#ffd700" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6,4" />

  <!-- Slot Reels / 7s Icon -->
  <g transform="translate(400, 115)" filter="url(#spin-shadow)">
    <!-- Triple Seven Badge -->
    <rect x="-45" y="-30" width="90" height="50" rx="8" fill="#180f2b" stroke="#ffd700" stroke-width="1.5" />
    <text x="0" y="7" font-family="'Inter', sans-serif" font-size="32" font-weight="900" fill="#ffd700" letter-spacing="4" text-anchor="middle">7 7 7</text>
  </g>

  <g transform="translate(400, 210)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#000" stroke="#a855f7" stroke-width="1.5" />
    <text x="0" y="5" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#c084fc" letter-spacing="3" text-anchor="middle">⚡ SUPER BONUS SLOT PROMOCIJA ⚡</text>
  </g>

  <text x="400" y="275" font-family="'Inter', sans-serif" font-size="34" font-weight="900" fill="url(#text-gold)" letter-spacing="2" text-anchor="middle">
    25 BESPLATNIH SPINOVA
  </text>

  <g transform="translate(400, 335)">
    <rect x="-210" y="-22" width="420" height="44" rx="22" fill="#ffd700" stroke="#fff" stroke-width="1.5" />
    <text x="0" y="8" font-family="'Inter', sans-serif" font-size="19" font-weight="900" fill="#180f2b" letter-spacing="1.2" text-anchor="middle">
      2x DUPLIRANI DOBICI U SUPER BONUSU
    </text>
  </g>

  <text x="400" y="390" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#f3e8ff" text-anchor="middle">
    Zavrtite slot aparat odmah, osvojite besplatne spinove i podignite dobitak!
  </text>
  <text x="400" y="414" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#c084fc" text-anchor="middle">
    📍 GRAND ONLINE • ZAVRTITE BEZ ULOGA UZ BONUS MNOŽILAC
  </text>
</svg>