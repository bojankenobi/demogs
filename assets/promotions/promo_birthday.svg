<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-grad-bday" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1304" />
      <stop offset="50%" stop-color="#362208" />
      <stop offset="100%" stop-color="#0d0802" />
    </linearGradient>
    <radialGradient id="amber-glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#d4af37" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="text-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="bday-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#fbbf24" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-bday)" />
  <circle cx="400" cy="160" r="260" fill="url(#amber-glow)" />

  <rect x="18" y="18" width="764" height="414" rx="14" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-opacity="0.5" />
  <rect x="26" y="26" width="748" height="398" rx="10" fill="none" stroke="#ffd700" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6,4" />

  <!-- Gift Box Icon -->
  <g transform="translate(400, 115)" filter="url(#bday-shadow)">
    <!-- Box Body -->
    <rect x="-32" y="-15" width="64" height="50" rx="4" fill="#ffd700" stroke="#fff" stroke-width="1.5" />
    <!-- Lid -->
    <rect x="-38" y="-28" width="76" height="15" rx="3" fill="#f59e0b" stroke="#fff" stroke-width="1.5" />
    <!-- Vertical Ribbon -->
    <rect x="-7" y="-28" width="14" height="63" fill="#ef4444" />
    <!-- Ribbon Bow -->
    <path d="M 0 -28 C -20 -48 -40 -25 -10 -28 C 0 -28 0 -28 0 -28 C 0 -28 0 -28 10 -28 C 40 -25 20 -48 0 -28 Z" fill="#ef4444" stroke="#fff" stroke-width="1" />
  </g>

  <g transform="translate(400, 210)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#000" stroke="#fbbf24" stroke-width="1.5" />
    <text x="0" y="5" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#fbbf24" letter-spacing="3" text-anchor="middle">🎁 SPECIJALNI VIP ROĐENDAN 🎁</text>
  </g>

  <text x="400" y="275" font-family="'Inter', sans-serif" font-size="34" font-weight="900" fill="url(#text-gold)" letter-spacing="2" text-anchor="middle">
    SREĆAN ROĐENDAN OD GRAND SLOTA
  </text>

  <g transform="translate(400, 335)">
    <rect x="-210" y="-22" width="420" height="44" rx="22" fill="#ffd700" stroke="#fff" stroke-width="1.5" />
    <text x="0" y="8" font-family="'Inter', sans-serif" font-size="19" font-weight="900" fill="#140a02" letter-spacing="1.2" text-anchor="middle">
      2.000 ZLT POKLON NA BLAGAJNI
    </text>
  </g>

  <text x="400" y="390" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#fef3c7" text-anchor="middle">
    Vaš rođendanski vaučer vas čeka! Preuzmite QR kod i unovčite ga u klubu.
  </text>
  <text x="400" y="414" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#fbbf24" text-anchor="middle">
    📍 GRAND BLAGAJNA • POKLON VAŽI TOKOM CELOG ROĐENDANSKOG MESECA
  </text>
</svg>