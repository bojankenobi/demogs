<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-grad-drink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b12" />
      <stop offset="50%" stop-color="#2d0f1b" />
      <stop offset="100%" stop-color="#0a0306" />
    </linearGradient>
    <radialGradient id="ruby-glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#d4af37" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="text-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <filter id="drink-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#f43f5e" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-drink)" />
  <circle cx="400" cy="160" r="260" fill="url(#ruby-glow)" />

  <rect x="18" y="18" width="764" height="414" rx="14" fill="none" stroke="#f43f5e" stroke-width="1.8" stroke-opacity="0.5" />
  <rect x="26" y="26" width="748" height="398" rx="10" fill="none" stroke="#ffd700" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6,4" />

  <!-- Cocktail & Flower Cluster -->
  <g transform="translate(400, 115)" filter="url(#drink-shadow)">
    <!-- Cocktail Glass Icon -->
    <path d="M -36 -40 L 36 -40 L 4 0 L 4 36 L 24 36 L 24 44 L -24 44 L -24 36 L -4 36 L -4 0 Z" fill="#ffd700" stroke="#fff" stroke-width="1.5" />
    <path d="M -26 -32 L 26 -32 L 0 -2 Z" fill="#f43f5e" opacity="0.85" />
    <!-- Olive / Flower detail -->
    <circle cx="8" cy="-35" r="7" fill="#10b981" stroke="#fff" stroke-width="1" />
  </g>

  <g transform="translate(400, 210)">
    <rect x="-130" y="-14" width="260" height="28" rx="14" fill="#000" stroke="#f43f5e" stroke-width="1.5" />
    <text x="0" y="5" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#f43f5e" letter-spacing="3" text-anchor="middle">🍸 VIP HOSPITALITY POKLON 🍸</text>
  </g>

  <text x="400" y="275" font-family="'Inter', sans-serif" font-size="34" font-weight="900" fill="url(#text-gold)" letter-spacing="2" text-anchor="middle">
    WELCOME DRINK NA ŠANKU
  </text>

  <g transform="translate(400, 335)">
    <rect x="-220" y="-22" width="440" height="44" rx="22" fill="#ffd700" stroke="#fff" stroke-width="1.5" />
    <text x="0" y="8" font-family="'Inter', sans-serif" font-size="19" font-weight="900" fill="#140a02" letter-spacing="1.2" text-anchor="middle">
      KOKTEL ILI PREMIUM PIĆE PO IZBORU
    </text>
  </g>

  <text x="400" y="390" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#f5e6cc" text-anchor="middle">
    Pokažite QR kod konobaru ili šankeru prilikom dolaska u bilo koji Grand Slot Club.
  </text>
  <text x="400" y="414" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#ffd700" text-anchor="middle">
    📍 GRAND SLOT VIP BAR • JEDNOSTAVNA VERIFIKACIJA NA ŠANKU
  </text>
</svg>