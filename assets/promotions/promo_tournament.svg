<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-grad-tour" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1420" />
      <stop offset="50%" stop-color="#12253b" />
      <stop offset="100%" stop-color="#050a12" />
    </linearGradient>
    <radialGradient id="cyan-glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#ffd700" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="text-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="tour-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#38bdf8" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-tour)" />
  <circle cx="400" cy="160" r="260" fill="url(#cyan-glow)" />

  <rect x="18" y="18" width="764" height="414" rx="14" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.5" />
  <rect x="26" y="26" width="748" height="398" rx="10" fill="none" stroke="#ffd700" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6,4" />

  <!-- Trophy Icon -->
  <g transform="translate(400, 115)" filter="url(#tour-shadow)">
    <!-- Golden Trophy Cup -->
    <path d="M -30 -35 L 30 -35 L 24 5 C 20 25 -20 25 -24 5 Z" fill="#ffd700" stroke="#fff" stroke-width="1.5" />
    <!-- Handles -->
    <path d="M -30 -25 C -46 -25 -46 0 -22 0" fill="none" stroke="#ffd700" stroke-width="4" stroke-linecap="round" />
    <path d="M 30 -25 C 46 -25 46 0 22 0" fill="none" stroke="#ffd700" stroke-width="4" stroke-linecap="round" />
    <!-- Stem & Base -->
    <rect x="-6" y="18" width="12" height="16" fill="#f59e0b" />
    <polygon points="-24 42 24 42 16 34 -16 34" fill="#ffd700" stroke="#fff" stroke-width="1" />
  </g>

  <g transform="translate(400, 210)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#000" stroke="#38bdf8" stroke-width="1.5" />
    <text x="0" y="5" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#38bdf8" letter-spacing="3" text-anchor="middle">🏆 BRZI 120s KAZINO TURNIR 🏆</text>
  </g>

  <text x="400" y="275" font-family="'Inter', sans-serif" font-size="34" font-weight="900" fill="url(#text-gold)" letter-spacing="2" text-anchor="middle">
    BESPLATNA VIP ULAZNICA
  </text>

  <g transform="translate(400, 335)">
    <rect x="-210" y="-22" width="420" height="44" rx="22" fill="#ffd700" stroke="#fff" stroke-width="1.5" />
    <text x="0" y="8" font-family="'Inter', sans-serif" font-size="19" font-weight="900" fill="#0f172a" letter-spacing="1.2" text-anchor="middle">
      NAGRADNI FOND: 50.000 ZLT
    </text>
  </g>

  <text x="400" y="390" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">
    Zavrtite najjače u 120 sekundi, zauzmite vrh tabele i osvojite keš nagrade!
  </text>
  <text x="400" y="414" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#38bdf8" text-anchor="middle">
    📍 GRAND ARENA • DNEVNI I VIKEND TURNIRI SA ŽIVIM RANGRIRANJEM
  </text>
</svg>