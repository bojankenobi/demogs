      <stop offset="0%" stop-color="#140a02" />
      <stop offset="45%" stop-color="#241405" />
      <stop offset="75%" stop-color="#0f0701" />
      <stop offset="100%" stop-color="#050200" />
    </linearGradient>
    <radialGradient id="gold-glow" cx="50%" cy="40%" r="55%">
