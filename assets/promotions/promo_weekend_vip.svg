      <path fill="#ffffff" d="M64.88,42.15c-.25,0-.45.18-.49.42-.02.13-1.94,11.8-4.94,14.78-3,2.98-14.68,4.83-14.81,4.85-.24.04-.42.24-.43.49,0,.25.18.45.42.49.13.02,11.8,1.94,14.78,4.94,2.98,3,4.83,14.68,4.85,14.81.03.24.24.42.49.42s.45-.18.49-.42c.02-.13,1.94-11.8,4.94-14.78,3-2.98,14.68-4.83,14.81-4.85.24-.03.42-.24.42-.49,0-.25-.18-.45-.42-.49-.13-.02-11.8-1.94-14.78-4.94-2.98-3-4.83-14.68-4.85-14.81-.03-.24-.24-.42-.49-.42h0Z"/>
