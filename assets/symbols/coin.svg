      <polygon fill="url(#coin-flower-gold)" stroke="#fff" stroke-width="0.8" points="72.13 125.35 85.06 105.68 74.54 83.86 61.62 103.53 72.13 125.35"/>
      <polygon fill="url(#coin-flower-gold)" stroke="#fff" stroke-width="0.8" points="119.33 95.07 112.02 72.7 88.4 67.31 95.72 89.68 119.33 95.07"/>
