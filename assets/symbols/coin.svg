<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="c-rim" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#fffce8" />
      <stop offset="30%" stop-color="#f6c845" />
      <stop offset="65%" stop-color="#bf850b" />
      <stop offset="100%" stop-color="#543600" />
    </radialGradient>
    <radialGradient id="c-inner" cx="42%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ffe680" />
      <stop offset="55%" stop-color="#d49514" />
      <stop offset="100%" stop-color="#704400" />
    </radialGradient>
    <linearGradient id="coin-flower-gold" x1="0%" y1="0%" x2="0%" y2="100%">
