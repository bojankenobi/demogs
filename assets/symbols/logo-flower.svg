<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- IGT Vibrant Neon Purple Gradients -->
    <linearGradient id="igt-sym-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9d6" />
      <stop offset="30%" stop-color="#f6c845" />
      <stop offset="70%" stop-color="#d49514" />
      <stop offset="100%" stop-color="#704400" />
    </linearGradient>
    <radialGradient id="igt-sym-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b0a66" />
      <stop offset="55%" stop-color="#1e0436" />
      <stop offset="100%" stop-color="#0a0113" />
    </radialGradient>
    <radialGradient id="igt-glow-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b859fd" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8c30e8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="igt-sym-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#b859fd" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#igt-sym-shadow)">
